<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ScoutWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080D1A;
      --surface: #0F1629;
      --border: #1C2740;
      --accent: #2563EB;
      --accent-glow: rgba(37, 99, 235, 0.25);
      --text: #F0F4FF;
      --muted: #5B6D8A;
      --label: #8AA0C0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px var(--accent-glow);
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title-block {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .app-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .tagline {
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--label);
      line-height: 1.6;
      max-width: 28ch;
      margin: 0 auto;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    .meta-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .meta-value {
      font-size: 0.82rem;
      color: var(--label);
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.95rem 1.5rem;
      background: var(--accent);
      color: #fff;
      font-family: 'Sora', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      transition: opacity 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 24px var(--accent-glow);
    }

    .download-btn:hover {
      opacity: 0.88;
      box-shadow: 0 6px 32px rgba(37, 99, 235, 0.4);
    }

    .download-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .download-btn.secondary {
      background: transparent;
      color: var(--label);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .download-btn.secondary:hover {
      background: var(--border);
      opacity: 1;
      box-shadow: none;
    }

    .download-btn.secondary svg {
      stroke: var(--label);
    }

    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn-label {
      font-size: 0.68rem;
      color: var(--muted);
      text-align: center;
      margin-top: -0.25rem;
      letter-spacing: 0.01em;
    }

    .downloads {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .download-label {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
    }

    .download-btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      box-shadow: none;
      color: var(--label);
    }

    .download-btn.secondary svg {
      stroke: var(--label);
    }

    .download-btn.secondary:hover {
      border-color: var(--accent);
      color: var(--text);
      opacity: 1;
    }

    .download-btn.secondary:hover svg {
      stroke: var(--text);
    }

    .note {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: no-preference) {
      .card {
        animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="22" y2="22"/>
        <line x1="11" y1="8" x2="11" y2="14"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </div>

    <div class="title-block">
      <div class="app-name">ScoutWise</div>
      <div class="tagline">Smart outreach, starting with the right people.</div>
    </div>

    <div class="divider"></div>

    <div class="meta">
      <div class="meta-label">Platform</div>
      <div class="meta-value">Android — APK</div>
    </div>

    <div class="downloads">
      <div class="download-label">Android App</div>
      <a class="download-btn" href="./ScoutWise.apk" download="ScoutWise.apk">
        <svg viewBox="0 0 24 24">
          <path d="M12 3v13M7 11l5 5 5-5"/>
          <path d="M3 20h18"/>
        </svg>
        Download ScoutWise
      </a>

      <div class="download-label" style="margin-top:0.5rem;">Chrome Extension</div>
      <a class="download-btn secondary" href="./ScoutWise-For-Facebook.zip" download="ScoutWise-For-Facebook.zip">
        <svg viewBox="0 0 24 24">
          <path d="M12 3v13M7 11l5 5 5-5"/>
          <path d="M3 20h18"/>
        </svg>
        ScoutWise for Facebook
      </a>
    </div>

    <p class="note">
      Enable "Install from unknown sources" in your Android settings before installing the app.
    </p>
  </div>
</body>
</html>
